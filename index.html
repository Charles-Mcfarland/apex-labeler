<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>APEX Polygon Labeler</title>
<style>
  :root{ --bg:#111; --panel:#1b1b1f; --ink:#eee; --accent:#39d353; }
  *{ box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px -apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #bar{ display:flex; flex-wrap:wrap; gap:6px; padding:6px 8px; background:var(--panel);
    align-items:center; border-bottom:1px solid #000; }
  .cls{ padding:8px 10px; border-radius:8px; border:2px solid transparent; color:#000;
    font-weight:700; min-width:42px; text-align:center; touch-action:manipulation; }
  .cls.active{ border-color:#fff; box-shadow:0 0 0 2px #000 inset; }
  .btn{ padding:8px 12px; border-radius:8px; background:#2a2a30; color:var(--ink);
    border:1px solid #3a3a42; font-weight:600; touch-action:manipulation; }
  .btn:active{ background:#3a3a42; }
  .btn.warn{ background:#5a1f1f; border-color:#7a2a2a; }
  .btn.go{ background:#1f5a2f; border-color:#2a7a3f; }
  #wrap{ position:absolute; top:auto; left:0; right:0; bottom:0; }
  #cv{ display:block; touch-action:none; background:#000; }
  #status{ position:fixed; left:8px; bottom:8px; background:rgba(0,0,0,.6);
    padding:6px 10px; border-radius:8px; font-size:13px; pointer-events:none; max-width:60vw; }
  #hint{ position:fixed; right:8px; bottom:8px; background:rgba(0,0,0,.6);
    padding:6px 10px; border-radius:8px; font-size:12px; color:#aaa; pointer-events:none; }
  label.load{ display:inline-block; }
  input[type=file]{ display:none; }
  #zoomctl .btn{ min-width:40px; }
</style>
</head>
<body>
<div id="bar">
  <label class="load btn go">⬆︎ Load images<input id="file" type="file" accept="image/*" multiple></label>
  <label class="load btn">⬆︎ Import<input id="importf" type="file" accept=".json,.txt" multiple></label>
  <span id="nav" style="display:flex;gap:4px;align-items:center">
    <button class="btn" id="prev">◀</button>
    <span id="imgname" style="min-width:120px;text-align:center;font-size:12px">no image</span>
    <button class="btn" id="next">▶</button>
  </span>
  <span id="palette" style="display:flex;flex-wrap:wrap;gap:4px"></span>
  <span id="zoomctl" style="display:flex;gap:4px">
    <button class="btn" id="zin">＋</button>
    <button class="btn" id="zout">－</button>
    <button class="btn" id="fit">Fit</button>
  </span>
  <button class="btn go" id="mode">✏️ Draw</button>
  <button class="btn go" id="finish">✓ Finish</button>
  <button class="btn" id="undo">↶ Undo stroke</button>
  <button class="btn" id="simplify">⌁ Simplify</button>
  <button class="btn warn" id="delpoly">Del last poly</button>
  <button class="btn" id="clear">Clear img</button>
  <button class="btn go" id="export">⬇︎ Export .txt</button>
  <button class="btn" id="exportAll">⬇︎ All (JSON)</button>
  <button class="btn" id="savebtn">💾 Save</button>
  <span id="saved" style="opacity:.45;font-size:12px;color:var(--accent);align-self:center">Saved ✓</span>
  <button class="btn warn" id="reset">🗑 New session</button>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="status">Load a batch of images to start.</div>
<div id="hint">✏️ Trace in pieces — lift anytime &nbsp;•&nbsp; ✓ Finish to close &nbsp;•&nbsp; ✌️ pinch-zoom &nbsp;•&nbsp; ☝️ pan</div>

<script>
// ---- classes (index order MUST match the segmenter: T1..T7, M1..M4, main_beam, burr) ----
const CLASSES = ['T1','T2','T3','T4','T5','T6','T7','M1','M2','M3','M4','main_beam','burr'];
const COLORS  = ['#ff5d5d','#ff9f43','#ffd93d','#6bff6b','#3dd7c7','#4db5ff','#7c83ff',
                 '#c86bff','#ff6bd6','#ff9bb3','#b0ffd0','#9be7ff','#bbbbbb'];

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const DPR = Math.max(1, window.devicePixelRatio||1);
let images=[];          // {name, img, w, h}
let cur=-1;
let labels={};          // name -> [{cls, pts:[[x,y],...] in IMAGE pixels}]
let active=0;
let ordSeq=0;           // monotonic load-order counter so restored images keep their order
let view={scale:1, ox:0, oy:0};
let drawStrokes=null;   // in-progress polygon = array of pen strokes; lift the pen between strokes, ✓ Finish to close
let penDown=false;      // true only while the tip is touching glass (ignores Apple Pencil hover)
const SIMPLIFY_PX = 3;  // min pixel spacing between captured points (image space)
function curDrawPts(){ return drawStrokes ? drawStrokes.flat() : []; }
// ---- edit mode (correct model proposals / fix any polygon) ----
let mode='draw';        // 'draw' | 'edit'
let sel=null;           // index into curPolys() of selected polygon
let dragV=null;         // {pi,vi} vertex currently being dragged
let dragMoved=false, dragStart=null;
let lastTap={t:0,pi:-1,vi:-1};  // for double-tap-to-delete-vertex

// ---------- palette ----------
const pal=document.getElementById('palette');
CLASSES.forEach((c,i)=>{
  const b=document.createElement('div'); b.className='cls'; b.textContent=c;
  b.style.background=COLORS[i]; b.dataset.i=i;
  b.onclick=()=>{ if(mode==='edit' && sel!=null && curPolys()[sel]){ curPolys()[sel].cls=i; save(); }
    active=i; refreshPalette(); render(); status(); };
  pal.appendChild(b);
});
function refreshPalette(){ [...pal.children].forEach((b,i)=>b.classList.toggle('active', i===active)); }
refreshPalette();

// ---------- sizing ----------
function resize(){
  const top = document.getElementById('bar').getBoundingClientRect().height;
  const w = window.innerWidth, h = window.innerHeight - top;
  document.getElementById('wrap').style.top = top+'px';
  cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width = Math.round(w*DPR); cv.height = Math.round(h*DPR);
  render();
}
window.addEventListener('resize', resize);

// ---------- load ----------
document.getElementById('file').addEventListener('change', async e=>{
  const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));
  for(const f of files){
    await new Promise(r=>{
      const img=new Image();
      img.onload=async ()=>{
        if(!images.some(x=>x.name===f.name)) images.push({name:f.name, img, w:img.naturalWidth, h:img.naturalHeight});
        if(db){ try{ await idbPut({name:f.name, blob:f, w:img.naturalWidth, h:img.naturalHeight, ord:ordSeq++});
                      localStorage.setItem('apex_ord', ordSeq); }
                catch(err){ savedFlash('⚠️ storage full — export now'); } }
        r();
      };
      img.onerror=()=>r();
      img.src=URL.createObjectURL(f);
    });
  }
  if(cur<0 && images.length){ cur=0; fit(); }
  saveCur(); status(); savedFlash('Saved ✓');
});

function curName(){ return cur>=0 ? images[cur].name : null; }
function curPolys(){ const n=curName(); if(!n) return []; return (labels[n]||(labels[n]=[])); }

// ---------- view transform ----------
function fit(){
  if(cur<0) return;
  const im=images[cur];
  const s=Math.min(cv.width/im.w, cv.height/im.h)*0.96;
  view.scale=s; view.ox=(cv.width-im.w*s)/2; view.oy=(cv.height-im.h*s)/2;
  render();
}
function s2i(x,y){ return [(x*DPR-view.ox)/view.scale, (y*DPR-view.oy)/view.scale]; } // CSS px -> image px
function i2s(x,y){ return [x*view.scale+view.ox, y*view.scale+view.oy]; }              // image px -> canvas px
function zoomAt(cx,cy,factor){ // cx,cy in canvas px
  const [ix,iy]=[(cx-view.ox)/view.scale,(cy-view.oy)/view.scale];
  view.scale*=factor;
  view.ox=cx-ix*view.scale; view.oy=cy-iy*view.scale; render();
}

// ---------- render ----------
function render(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(cur<0){ return; }
  const im=images[cur];
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(im.img, view.ox, view.oy, im.w*view.scale, im.h*view.scale);
  // committed polygons (highlight the selected one in edit mode)
  curPolys().forEach((p,i)=>drawPoly(p.pts, COLORS[p.cls], true, CLASSES[p.cls], mode==='edit'&&i===sel));
  // edit-mode vertex handles on the selected polygon
  if(mode==='edit' && sel!=null && curPolys()[sel]) drawHandles(curPolys()[sel].pts);
  // in-progress (multi-stroke; stays open until you tap ✓ Finish)
  if(drawStrokes){ const fp=curDrawPts(); if(fp.length){ drawPoly(fp, COLORS[active], false); drawStartDot(fp[0]); } }
}
function drawPoly(pts, color, closed, label, selected){
  if(pts.length<1) return;
  ctx.lineWidth=(selected?4:2)*DPR; ctx.strokeStyle=selected?'#fff':color;
  ctx.fillStyle=color+(selected?'55':'33');
  ctx.beginPath();
  pts.forEach(([x,y],k)=>{ const [sx,sy]=i2s(x,y); k?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
  if(closed){ ctx.closePath(); ctx.fill(); }
  ctx.stroke();
  if(closed && label){
    const [lx,ly]=i2s(pts[0][0],pts[0][1]);
    ctx.fillStyle=color; ctx.font=`${13*DPR}px sans-serif`;
    ctx.fillText(label, lx+4, ly-4);
  }
}
function drawStartDot(pt){ // white anchor at the start point so you can see where Finish will close to
  const [sx,sy]=i2s(pt[0],pt[1]);
  ctx.beginPath(); ctx.arc(sx,sy,5*DPR,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.lineWidth=2*DPR; ctx.strokeStyle='#000'; ctx.stroke();
}
function drawHandles(pts){ // draggable vertex dots on the selected polygon (edit mode)
  pts.forEach(([x,y])=>{ const [sx,sy]=i2s(x,y);
    ctx.beginPath(); ctx.arc(sx,sy,7*DPR,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=2*DPR; ctx.strokeStyle='#000'; ctx.stroke(); });
}

// ---------- pointer handling: PEN draws, TOUCH pans/zooms ----------
const pts=new Map(); // active touch pointers
let panLast=null, pinchBase=null;
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  if(e.pointerType==='pen' || e.pointerType==='mouse'){
    penDown=true;
    if(mode==='edit'){ editDown(e); return; }
    if(!drawStrokes) drawStrokes=[];   // start a new polygon only if none is in progress
    drawStrokes.push([]);              // begin a fresh stroke
    pushPenPoint(e); render(); status();
  } else if(e.pointerType==='touch'){
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ panLast={x:e.clientX,y:e.clientY}; }
    else if(pts.size===2){ pinchBase=pinchState(); panLast=null; }
  }
});
cv.addEventListener('pointermove', e=>{
  if((e.pointerType==='pen'||e.pointerType==='mouse') && penDown){
    if(mode==='edit'){ editMove(e); return; }
    if(drawStrokes){ pushPenPoint(e); render(); }
  } else if(e.pointerType==='touch' && pts.has(e.pointerId)){
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2 && pinchBase){
      const ps=pinchState();
      zoomAtCss(ps.mx,ps.my, ps.dist/pinchBase.dist);
      // pan with the midpoint movement too
      view.ox += (ps.mx-pinchBase.mx)*DPR; view.oy += (ps.my-pinchBase.my)*DPR;
      pinchBase=ps; render();
    } else if(pts.size===1 && panLast){
      view.ox += (e.clientX-panLast.x)*DPR; view.oy += (e.clientY-panLast.y)*DPR;
      panLast={x:e.clientX,y:e.clientY}; render();
    }
  }
});
function endPtr(e){
  if(e.pointerType==='pen'||e.pointerType==='mouse'){
    if(mode==='edit'){ editUp(e); penDown=false; return; }
    penDown=false;        // tip left the glass; stop capturing (hover is ignored)
    if(drawStrokes){ render(); status(); }  // polygon stays OPEN — lift, zoom in, keep tracing, then tap ✓ Finish
  } else if(e.pointerType==='touch'){
    pts.delete(e.pointerId);
    if(pts.size<2) pinchBase=null;
    if(pts.size===1){ const p=[...pts.values()][0]; panLast={x:p.x,y:p.y}; } else panLast=null;
  }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', e=>{ if(e.pointerType==='mouse'&&(drawStrokes||dragV)) endPtr(e); });

// ---------- EDIT MODE: select / drag / add / delete vertices, relabel ----------
function evImg(e){ const r=cv.getBoundingClientRect(); return s2i(e.clientX-r.left, e.clientY-r.top); }
function evScr(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*DPR,(e.clientY-r.top)*DPR]; }
function editDown(e){
  const [sx,sy]=evScr(e); dragMoved=false; dragStart={sx,sy};
  const hv=hitVertex(sx,sy);                              // 1) grab a vertex (selects its polygon)
  if(hv){ sel=hv.pi; dragV=hv; render(); status(); return; }
  const he=hitEdge(sx,sy);                                // 2) tap the outline of selected -> insert + grab
  if(he){ curPolys()[sel].pts.splice(he.vi+1,0,[he.x,he.y]); dragV={pi:sel,vi:he.vi+1}; dragMoved=true; render(); status(); return; }
  const [ix,iy]=evImg(e); const pi=polyAt(ix,iy);         // 3) tap a shape body -> select it
  if(pi!=null){ sel=pi; dragV=null; render(); status(); return; }
  sel=null; dragV=null; render(); status();               // 4) tap empty -> deselect
}
function editMove(e){
  if(!dragV) return;
  const [sx,sy]=evScr(e);
  if(dragStart && Math.hypot(sx-dragStart.sx,sy-dragStart.sy)>3*DPR) dragMoved=true;
  const [ix,iy]=evImg(e); const p=curPolys()[dragV.pi]; if(!p) return;
  p.pts[dragV.vi]=[ix,iy]; render();
}
function editUp(e){
  if(dragV){
    if(!dragMoved){                                        // a tap (not a drag) on a vertex
      const now=Date.now();
      if(now-lastTap.t<350 && lastTap.pi===dragV.pi && lastTap.vi===dragV.vi){
        const p=curPolys()[dragV.pi];
        if(p && p.pts.length>3){ p.pts.splice(dragV.vi,1); save(); }   // double-tap -> delete vertex
        lastTap={t:0,pi:-1,vi:-1};
      } else lastTap={t:now, pi:dragV.pi, vi:dragV.vi};
    } else save();                                         // vertex was moved
  }
  dragV=null; render(); status();
}
function hitVertex(sx,sy){
  const R=15*DPR, order=[]; if(sel!=null) order.push(sel);
  curPolys().forEach((_,i)=>{ if(i!==sel) order.push(i); });
  for(const pi of order){ const p=curPolys()[pi];
    for(let vi=0;vi<p.pts.length;vi++){ const [vx,vy]=i2s(p.pts[vi][0],p.pts[vi][1]);
      if(Math.hypot(vx-sx,vy-sy)<=R) return {pi,vi}; } }
  return null;
}
function hitEdge(sx,sy){
  if(sel==null) return null; const p=curPolys()[sel]; if(!p||p.pts.length<2) return null;
  const R=12*DPR; let best=null;
  for(let vi=0;vi<p.pts.length;vi++){
    const a=i2s(p.pts[vi][0],p.pts[vi][1]); const j=(vi+1)%p.pts.length; const b=i2s(p.pts[j][0],p.pts[j][1]);
    const pr=projSeg(sx,sy,a[0],a[1],b[0],b[1]);
    if(pr.d<=R && (!best||pr.d<best.d)) best={vi,d:pr.d,t:pr.t};
  }
  if(!best) return null;
  const p1=p.pts[best.vi], p2=p.pts[(best.vi+1)%p.pts.length];
  return {vi:best.vi, x:p1[0]+(p2[0]-p1[0])*best.t, y:p1[1]+(p2[1]-p1[1])*best.t};
}
function projSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1;
  let t=((px-ax)*dx+(py-ay)*dy)/L2; t=Math.max(0,Math.min(1,t));
  return {d:Math.hypot(px-(ax+t*dx),py-(ay+t*dy)), t};
}
function polyAt(ix,iy){ const ps=curPolys();
  for(let i=ps.length-1;i>=0;i--){ if(pointInPoly(ix,iy,ps[i].pts)) return i; } return null; }
function pointInPoly(x,y,pts){ let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi)) inside=!inside; }
  return inside; }
// ---------- polygon simplification (Ramer–Douglas–Peucker) — thins dense model masks ----------
function ptLineDist(p,a,b){ const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;
  return Math.abs((p[0]-a[0])*dy-(p[1]-a[1])*dx)/L; }
function rdp(pts,eps){
  if(pts.length<3) return pts.slice();
  const keep=new Array(pts.length).fill(false); keep[0]=keep[pts.length-1]=true;
  const stack=[[0,pts.length-1]];
  while(stack.length){ const [s,e]=stack.pop(); let dmax=0,idx=-1;
    for(let i=s+1;i<e;i++){ const d=ptLineDist(pts[i],pts[s],pts[e]); if(d>dmax){dmax=d;idx=i;} }
    if(dmax>eps && idx>0){ keep[idx]=true; stack.push([s,idx],[idx,e]); } }
  return pts.filter((_,i)=>keep[i]);
}
function simplifyPoly(pts,eps){ let out=rdp(pts,eps); return out.length>=3?out:pts.slice(); }

function pushPenPoint(e){
  const r=cv.getBoundingClientRect();
  const [ix,iy]=s2i(e.clientX-r.left, e.clientY-r.top);
  const stroke=drawStrokes[drawStrokes.length-1];
  const last=stroke[stroke.length-1];
  if(!last || Math.hypot(ix-last[0],iy-last[1])>=SIMPLIFY_PX){ stroke.push([ix,iy]); }
}
function pinchState(){
  const a=[...pts.values()];
  const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  return {dist, mx:(a[0].x+a[1].x)/2, my:(a[0].y+a[1].y)/2};
}
function zoomAtCss(cssx,cssy,factor){
  const r=cv.getBoundingClientRect();
  zoomAt((cssx-r.left)*DPR,(cssy-r.top)*DPR,factor);
}

// ---------- controls ----------
function finishPoly(){
  if(!drawStrokes) return;
  const fp=curDrawPts();
  if(fp.length>=3){ curPolys().push({cls:active, pts:fp}); save(); }
  drawStrokes=null; render(); status();
}
function undoStroke(){
  if(drawStrokes && drawStrokes.length){            // mid-polygon: drop the last pen stroke
    drawStrokes.pop(); if(!drawStrokes.length) drawStrokes=null;
  } else { curPolys().pop(); save(); }               // not drawing: drop the last finished polygon
  render(); status();
}
document.getElementById('prev').onclick=()=>{ if(cur>0){drawStrokes=null;sel=null;cur--;fit();saveCur();status();} };
document.getElementById('next').onclick=()=>{ if(cur<images.length-1){drawStrokes=null;sel=null;cur++;fit();saveCur();status();} };
document.getElementById('zin').onclick=()=>zoomAt(cv.width/2,cv.height/2,1.25);
document.getElementById('zout').onclick=()=>zoomAt(cv.width/2,cv.height/2,0.8);
document.getElementById('fit').onclick=fit;
document.getElementById('finish').onclick=finishPoly;
document.getElementById('undo').onclick=undoStroke;
document.getElementById('delpoly').onclick=()=>{ curPolys().pop(); save(); render(); status(); };
document.getElementById('clear').onclick=()=>{ if(confirm('Clear all polygons on this image?')){ labels[curName()]=[]; save(); render(); status(); } };
document.getElementById('savebtn').onclick=()=>{ save(); saveCur(); };
document.getElementById('reset').onclick=async ()=>{
  if(!confirm('Start a NEW session? This removes the loaded images + labels from THIS device. Export first if you want a backup.')) return;
  if(db){ try{ await idbClear(); }catch(e){} }
  localStorage.removeItem('apex_poly_labels'); localStorage.removeItem('apex_cur'); localStorage.removeItem('apex_ord');
  images=[]; labels={}; cur=-1; drawStrokes=null; sel=null; ordSeq=0;
  render(); status(); savedFlash('Cleared');
};
// ---- mode toggle + simplify ----
function setMode(m){ mode=m; drawStrokes=null; if(m!=='edit') sel=null;
  const b=document.getElementById('mode');
  b.textContent = m==='edit' ? '✋ Edit' : '✏️ Draw';
  b.classList.toggle('go', m==='draw'); b.classList.toggle('warn', m==='edit');
  render(); status(); updateHint(); }
document.getElementById('mode').onclick=()=> setMode(mode==='edit'?'draw':'edit');
document.getElementById('simplify').onclick=()=>{
  if(mode!=='edit' || sel==null || cur<0) { savedFlash('Edit mode: select a shape first'); return; }
  const p=curPolys()[sel], im=images[cur];
  p.pts=simplifyPoly(p.pts, 0.006*Math.hypot(im.w,im.h)); save(); render(); status();
};
function updateHint(){ document.getElementById('hint').innerHTML = mode==='edit'
  ? '✋ tap a shape to select &nbsp;•&nbsp; drag a dot to move &nbsp;•&nbsp; double-tap a dot to delete &nbsp;•&nbsp; tap the outline to add &nbsp;•&nbsp; tap a class to relabel'
  : '✏️ Trace in pieces — lift anytime &nbsp;•&nbsp; ✓ Finish to close &nbsp;•&nbsp; ✌️ pinch-zoom &nbsp;•&nbsp; ☝️ pan'; }
// ---- import model proposals (or saved labels): All-JSON or a single YOLO .txt ----
function parseYolo(text, w, h, classMap){
  const polys=[];
  (text||'').split(/\r?\n/).forEach(line=>{
    const t=line.trim().split(/\s+/).filter(Boolean); if(t.length<7) return;
    let cls=parseInt(t[0],10); if(classMap && classMap[cls]!=null) cls=classMap[cls];
    const nums=t.slice(1).map(Number), pts=[];
    for(let i=0;i+1<nums.length;i+=2) pts.push([nums[i]*w, nums[i+1]*h]);
    if(pts.length>=3 && cls>=0 && cls<CLASSES.length) polys.push({cls,pts});
  });
  return polys;
}
function importJSON(obj){
  let classMap=null;
  if(Array.isArray(obj.classes)){ classMap={}; obj.classes.forEach((nm,i)=>{ const k=CLASSES.indexOf(nm); classMap[i]=k>=0?k:i; }); }
  let added=0, hit=0; const ents=obj.labels||{};
  Object.keys(ents).forEach(name=>{
    const en=ents[name], im=images.find(x=>x.name===name);
    const w=(en&&en.w)||(im&&im.w), h=(en&&en.h)||(im&&im.h); if(!w||!h) return;
    const yolo = typeof en==='string'? en : (en.yolo||'');
    const eps=0.004*Math.hypot(w,h);
    const polys=parseYolo(yolo,w,h,classMap).map(p=>({cls:p.cls, pts:simplifyPoly(p.pts,eps)}));
    if(polys.length){ (labels[name]||(labels[name]=[])).push(...polys); added+=polys.length; hit++; }
  });
  return {added,hit};
}
document.getElementById('importf').addEventListener('change', async e=>{
  const files=[...e.target.files]; let tot=0, hit=0;
  for(const f of files){
    try{
      const text=await f.text();
      if(f.name.toLowerCase().endsWith('.json')){ const r=importJSON(JSON.parse(text)); tot+=r.added; hit+=r.hit; }
      else if(cur>=0){ const im=images[cur]; const eps=0.004*Math.hypot(im.w,im.h);
        const polys=parseYolo(text,im.w,im.h,null).map(p=>({cls:p.cls,pts:simplifyPoly(p.pts,eps)}));
        if(polys.length){ curPolys().push(...polys); tot+=polys.length; hit++; } }
    }catch(err){ alert('Import failed for '+f.name+': '+err.message); }
  }
  save(); render(); status(); savedFlash(`Imported ${tot} polys / ${hit} imgs`); e.target.value='';
});

// YOLO-seg: "<cls> x1 y1 x2 y2 ..." normalized 0..1
function yoloFor(name){
  const im=images.find(x=>x.name===name); if(!im) return '';
  return (labels[name]||[]).map(p=>{
    const flat=p.pts.map(([x,y])=>`${(x/im.w).toFixed(6)} ${(y/im.h).toFixed(6)}`).join(' ');
    return `${p.cls} ${flat}`;
  }).join('\n');
}
function dl(filename, text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  a.download=filename; a.click();
}
document.getElementById('export').onclick=()=>{
  const n=curName(); if(!n){alert('No image');return;}
  const base=n.replace(/\.[^.]+$/,'');
  dl(base+'.txt', yoloFor(n));
};
document.getElementById('exportAll').onclick=()=>{
  const out={classes:CLASSES, labels:{}};
  images.forEach(im=>{ out.labels[im.name]={w:im.w,h:im.h, yolo:yoloFor(im.name)}; });
  dl('apex_labels_all.json', JSON.stringify(out,null,2));
};

// ---------- persistence: labels in localStorage, IMAGES in IndexedDB (survive refresh/lock/close) ----------
let db=null;
function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open('apex_labeler',1);
  r.onupgradeneeded=()=>{ r.result.createObjectStore('images',{keyPath:'name'}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbPut(rec){ return new Promise((res,rej)=>{ const tx=db.transaction('images','readwrite');
  tx.objectStore('images').put(rec); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function idbAll(){ return new Promise((res,rej)=>{ const tx=db.transaction('images','readonly');
  const rq=tx.objectStore('images').getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error); }); }
function idbClear(){ return new Promise(res=>{ const tx=db.transaction('images','readwrite');
  tx.objectStore('images').clear(); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }
function save(){ try{ localStorage.setItem('apex_poly_labels', JSON.stringify(labels)); savedFlash('Saved ✓'); }catch(e){ savedFlash('⚠️ save failed'); } }
function saveCur(){ try{ localStorage.setItem('apex_cur', cur); }catch(e){} }
let _flashT=null;
function savedFlash(msg){ const el=document.getElementById('saved'); if(!el) return;
  el.textContent=msg||'Saved ✓'; el.style.opacity='1';
  clearTimeout(_flashT); _flashT=setTimeout(()=>{ el.style.opacity='.45'; el.textContent='Saved ✓'; }, 1500); }

function status(){
  const n=curName();
  const total=Object.values(labels).reduce((a,b)=>a+(b?b.length:0),0);
  document.getElementById('imgname').textContent = n? `${cur+1}/${images.length}  ${n}` : 'no image';
  const drawing = drawStrokes ? `  •  ✏️ drawing ${CLASSES[active]} (${drawStrokes.length} strokes) — tap ✓ Finish` : '';
  const editing = mode==='edit'
    ? (sel!=null && curPolys()[sel] ? `  •  ✋ editing ${CLASSES[curPolys()[sel].cls]} (${curPolys()[sel].pts.length} pts)` : '  •  ✋ EDIT: tap a shape')
    : '';
  document.getElementById('status').textContent =
    n ? `Active class: ${CLASSES[active]}  •  this image: ${curPolys().length} polys  •  saved total: ${total}${drawing}${editing}`
      : 'Load a batch of images to start.';
}
// ---------- boot: restore labels + images, then go ----------
async function boot(){
  try{ const s=localStorage.getItem('apex_poly_labels'); if(s) labels=JSON.parse(s); }catch(e){}
  ordSeq = +localStorage.getItem('apex_ord') || 0;
  try{ db=await openDB(); }catch(e){ db=null; }
  if(db){
    try{
      const recs=await idbAll(); recs.sort((a,b)=>(a.ord||0)-(b.ord||0));
      for(const rec of recs){
        await new Promise(r=>{
          const img=new Image();
          img.onload=()=>{ images.push({name:rec.name, img, w:rec.w||img.naturalWidth, h:rec.h||img.naturalHeight}); r(); };
          img.onerror=()=>r();
          img.src=URL.createObjectURL(rec.blob);
        });
      }
    }catch(e){}
  }
  if(images.length){ cur=Math.min(+localStorage.getItem('apex_cur')||0, images.length-1); }
  resize();
  if(cur>=0) fit();
  status(); updateHint();
  if(images.length) savedFlash('Restored ✓');
}
boot();
</script>
